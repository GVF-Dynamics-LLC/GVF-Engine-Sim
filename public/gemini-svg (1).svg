<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <!-- Background Dark Glow -->
    <radialGradient id="bannerBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Cyan Glow Effect -->
    <filter id="cyanGlowBanner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Amber Glow Effect -->
    <filter id="amberGlowBanner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full Banner Canvas Background -->
  <rect width="2560" height="1440" fill="url(#bannerBg)" />

  <!-- Grid Pattern Overlay for High-Tech Aesthetic -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <path d="M 0 360 L 2560 360 M 0 720 L 2560 720 M 0 1080 L 2560 1080" />
    <path d="M 640 0 L 640 1440 M 1280 0 L 1280 1440 M 1920 0 L 1920 1440" />
  </g>

  <!-- ==================== SAFE AREA CONTENT (Centered) ==================== -->
  
  <!-- Dynamic Threshold Envelope Line V_th(t) (Amber Gold) -->
  <line x1="550" y1="680" x2="2010" y2="680" stroke="#F59E0B" stroke-width="8" stroke-dasharray="24 18" filter="url(#amberGlowBanner)" />
  <text x="2025" y="690" fill="#F59E0B" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700">V_th(t)</text>

  <!-- Continuous Carrier Wave (Electric Cyan Sine Trajectory) -->
  <path d="M 550 820 Q 750 420 950 680 T 1350 680 T 1750 680 T 2010 520" fill="none" stroke="#00F0FF" stroke-width="16" stroke-linecap="round" filter="url(#cyanGlowBanner)" />

  <!-- System Nodes -->
  <circle cx="740" cy="680" r="14" fill="#00F0FF" />
  <circle cx="740" cy="680" r="24" fill="none" stroke="#00F0FF" stroke-width="3" />
  <circle cx="850" cy="540" r="16" fill="#10B981" />
  <circle cx="1150" cy="820" r="14" fill="#EF4444" />

  <!-- Main Brand Title & Tagline -->
  <text x="1280" y="600" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" letter-spacing="12">GVF DYNAMICS</text>
  <text x="1280" y="780" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" letter-spacing="6">HARDWARE-ENFORCED AI GOVERNANCE &amp; SNN ARCHITECTURE</text>
  <text x="1280" y="830" text-anchor="middle" fill="#00F0FF" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="4">SUB-0.01ms ENTROPY CIRCUIT BREAKER | U.S. PATENT PENDING</text>
</svg>
